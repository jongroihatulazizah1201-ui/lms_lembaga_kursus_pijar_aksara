[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "MANUAL_TRANSFER_ACCOUNT_NAME,MANUAL_TRANSFER_ACCOUNT_NUMBER,MANUAL_TRANSFER_BANK_NAME,CRON_SECRET"

[functions]
  directory = "netlify/functions"

[functions."payment-cron"]
  schedule = "@hourly"
